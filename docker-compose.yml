services:
  ndr-flow-console:
    build: .
    ports:
      - "4173:4173"
    env_file:
      - .env
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      NDR_DATA_DIR: /data
    volumes:
      - ndr-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
    init: true
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  ndr-data:
